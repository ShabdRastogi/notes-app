<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Note</title>
</head>
<body>
  <h1>Delete Note</h1>
  <p>Are you sure you want to delete "{{ note.title }}"?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
  </form>
  <br>
  <a href="{% url 'notes' %}">Cancel</a>
</body>
</html>
