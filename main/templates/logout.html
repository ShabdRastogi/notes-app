<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:white;padding:35px;text-align:center;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .icon{font-size:42px;margin-bottom:10px}
    h1{margin:0 0 12px}
    p{color:#6b7280;margin-bottom:25px}
    .logout{width:100%;padding:13px;border:0;border-radius:9px;background:#dc2626;color:white;font-size:15px;font-weight:600;cursor:pointer}
    .logout:hover{background:#b91c1c}
    .cancel{display:block;margin-top:16px;color:#4f46e5;text-decoration:none}
    .cancel:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">👋</div>

    <h1>Logout</h1>

    <p>Are you sure you want to logout?</p>

    <form method="POST">
      {% csrf_token %}
      <button class="logout" type="submit">Yes, Logout</button>
    </form>

    <a class="cancel" href="{% url 'main' %}">Cancel</a>
  </div>
</body>
</html>
