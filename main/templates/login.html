<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:white;padding:35px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .logo{text-align:center;font-size:38px;margin-bottom:8px}
    h1{text-align:center;margin:0 0 25px;font-size:28px}
    label{display:block;font-weight:600;margin:16px 0 8px}
    input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;outline:none}
    input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .error{background:#fee2e2;color:#b91c1c;padding:11px;border-radius:8px;margin-top:18px;font-size:14px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#4f46e5;color:white;font-size:15px;font-weight:600;cursor:pointer}
    button:hover{background:#4338ca}
    .register{text-align:center;margin:20px 0 0;color:#6b7280}
    .register a{color:#4f46e5;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📝</div>

    <h1>Welcome Back</h1>

    <form method="POST">
      {% csrf_token %}

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit">Login</button>
    </form>

    <p class="register">
      Don't have an account?
      <a href="{% url 'register' %}">Register</a>
    </p>
  </div>
</body>
</html>
