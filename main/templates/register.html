<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:white;padding:35px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .logo{text-align:center;font-size:38px;margin-bottom:8px}
    h1{text-align:center;margin:0 0 25px;font-size:28px}
    input{width:100%;padding:13px;margin-bottom:14px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;outline:none}
    input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .error{background:#fee2e2;color:#b91c1c;padding:11px;border-radius:8px;margin:2px 0 16px;font-size:14px}
    button{width:100%;margin-top:5px;padding:13px;border:0;border-radius:9px;background:#4f46e5;color:white;font-size:15px;font-weight:600;cursor:pointer}
    button:hover{background:#4338ca}
    .login{text-align:center;margin:20px 0 0;color:#6b7280}
    .login a{color:#4f46e5;text-decoration:none;font-weight:600}
    #password-requirements{
        list-style:none;
        padding:0;
        margin:-5px 0 14px;
        font-size:13px;
        color:#6b7280;
    }
    #password-requirements li{
        margin:4px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📝</div>

    <h1>Create Account</h1>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="username" placeholder="Username" required>
      <input id="password" type="password" name="password" placeholder="Password" required>
      <ul id="password-requirements">
          <li id="length">❌ At least 8 characters</li>
          <li id="uppercase">❌ At least one uppercase letter</li>
          <li id="lowercase">❌ At least one lowercase letter</li>
          <li id="number">❌ At least one number</li>
          <li id="special">❌ At least one special character (@$!%*?&)</li>
      </ul>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit">Register</button>
    </form>

    <p class="login">
      Already have an account?
      <a href="{% url 'login' %}">Login</a>
    </p>
  </div>
  <script>
    const password = document.getElementById('password');
    password.addEventListener('input', function() {
        const value = password.value;
        document.getElementById('length').textContent =
            (value.length >= 8 ? '✅' : '❌') + ' At least 8 characters';
        document.getElementById('uppercase').textContent =
            (/[A-Z]/.test(value) ? '✅' : '❌') + ' At least one uppercase letter';
        document.getElementById('lowercase').textContent =
            (/[a-z]/.test(value) ? '✅' : '❌') + ' At least one lowercase letter';
        document.getElementById('number').textContent =
            (/[0-9]/.test(value) ? '✅' : '❌') + ' At least one number';
        document.getElementById('special').textContent =
            (/[@$!%*?&]/.test(value) ? '✅' : '❌') + ' At least one special character (@$!%*?&)';
    });
  </script>
</body>
</html>
