<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Note</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:600px;background:white;padding:35px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 25px;font-size:30px}
    label{display:block;font-weight:600;margin:16px 0 8px}
    input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;font-family:inherit;outline:none}
    input:focus,textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    textarea{min-height:180px;resize:vertical}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#4f46e5;color:white;font-size:15px;font-weight:600;cursor:pointer}
    button:hover{background:#4338ca}
    .back{display:block;text-align:center;margin-top:18px;color:#4f46e5;text-decoration:none}
    .back:hover{text-decoration:underline}
    input[type="file"]{
    padding:10px;
    background:#f9fafb;
    cursor:pointer;
}

.current-image{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:10px;
    margin-top:12px;
    border:1px solid #e5e7eb;
    background:#f9fafb;
    display:block;
}
.delete-image{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#dc2626;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.delete-image:hover{
    background:#b91c1c;
}
  </style>
</head>
<body>
  <div class="card">
    <h1>Edit Note</h1>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label>Title</label>
      <input type="text" name="title" value="{{ note.title }}" required>

      <label>Description</label>
      <textarea name="description" required>{{ note.description }}</textarea>
      <input type="file" name="image" accept="image/*" onchange="previewImage(event)">
      <img id="image-preview" class="current-image" src="" alt="Image Preview" style="display:none;">
      {% if note.image %}
        <img src="{{ note.image.url }}" class="current-image" alt="{{ note.title }}">
      {% endif %}

      <button type="submit">Update Note</button>
    </form>
    {% if note.image %}
      <form method="POST" action="{% url 'delete_image' note.id %}">
        {% csrf_token %}
        <button type="submit" class="delete-image">Delete Image</button>
      </form>
    {% endif %}

    <a class="back" href="{% url 'notes' %}">← Back to Notes</a>
  </div>
  <script>
    function previewImage(event){
        const preview=document.getElementById('image-preview');
        const file=event.target.files[0];

        if(file){
            preview.src=URL.createObjectURL(file);
            preview.style.display='block';
        }
    }
    </script>
</body>
</html>
